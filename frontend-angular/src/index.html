<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Maç Analiz</title>
  <script>
    // Tema ilk boyamadan önce uygulanır (açılışta yanlış tema bir an bile görünmesin): kayıtlı seçim, yoksa sistem tercihi.
    // Anahtar components/theme-toggle.ts'teki THEME_KEY ile aynı olmalı.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('matchforecast.theme'); } catch (e) { /* gizli pencere vb. */ }
      if (theme !== 'light' && theme !== 'dark')
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
    // Dil de ilk boyamadan önce belirlenir (src/app/core/i18n/i18n.ts buradan okur; LANG_KEY ile aynı anahtar):
    // ?lang= (ör. şifre sıfırlama e-postasındaki bağlantı) > kayıtlı seçim > tarayıcı dili (tr ise tr, değilse en).
    (function () {
      var key = 'matchforecast.lang';
      var url = new URL(window.location.href);
      var lang = url.searchParams.get('lang');
      if (lang === 'tr' || lang === 'en') {
        try { localStorage.setItem(key, lang); } catch (e) { /* yok say */ }
        url.searchParams.delete('lang');
        history.replaceState(null, '', url);
      } else {
        try { lang = localStorage.getItem(key); } catch (e) { lang = null; }
      }
      if (lang !== 'tr' && lang !== 'en')
        lang = (navigator.language || 'tr').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
      document.documentElement.lang = lang;
      document.title = lang === 'en' ? 'Match Forecast' : 'Maç Analiz';
    })();
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
