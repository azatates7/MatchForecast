<div class="app">
  <header class="topbar">
    <h1 class="brand">MatchForecast</h1>
    <div class="date-nav">
      <button type="button" (click)="shiftDay(-1)" aria-label="Önceki gün">‹</button>
      <input type="date" [value]="date()" (change)="onDateInput($any($event.target).value)" aria-label="Tarih" />
      <button type="button" (click)="shiftDay(1)" aria-label="Sonraki gün">›</button>
    </div>
    <div class="cache-actions">
      @if (cacheState().message) {
        <span [class]="cacheState().error ? 'cache-msg cache-msg-error' : 'cache-msg'" role="status">{{ cacheState().message }}</span>
      }
      <button type="button" class="cache-btn" (click)="handleClearCache()" [disabled]="cacheState().clearing">
        {{ cacheState().clearing ? 'Temizleniyor…' : 'Cache Temizle' }}
      </button>
      @if (passwordState().error) {
        <span class="cache-msg cache-msg-error" role="status">{{ passwordState().error }}</span>
      }
      @if (passwordState().password) {
        <span class="password-box">
          <code class="password-value" aria-label="Oluşturulan şifre">{{ passwordState().password }}</code>
          <button type="button" class="cache-btn" (click)="handleCopyPassword()">
            {{ passwordState().copied ? 'Kopyalandı' : 'Kopyala' }}
          </button>
        </span>
      }
      <button type="button" class="cache-btn" (click)="handleGeneratePassword()" [disabled]="passwordState().loading">
        {{ passwordState().loading ? 'Oluşturuluyor…' : 'Şifre Oluştur' }}
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="fixtures" aria-label="Maçlar">
      <input
        class="search"
        type="search"
        placeholder="Takım veya lig ara"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
      <select
        class="league-filter"
        [value]="league()"
        (change)="league.set($any($event.target).value)"
        aria-label="Lig / turnuva filtresi"
        [disabled]="leagueOptions().length === 0"
      >
        <option value="">Tüm ligler ({{ matches().length }})</option>
        @for (opt of leagueOptions(); track opt[0]) {
          <option [value]="opt[0]" [selected]="opt[0] === league()">{{ opt[0] }} ({{ opt[1] }})</option>
        }
      </select>
      <app-match-list
        [matches]="filtered()"
        [loading]="matchesState().loading"
        [error]="matchesState().error"
        [selectedId]="selectedId()"
        [fetchedAt]="fetchedAt()"
        [now]="now()"
        (select)="analyze($event)"
      />
    </section>

    <section class="analysis" aria-live="polite">
      <app-forecast-panel
        [match]="selected()"
        [forecast]="forecast()"
        [loading]="forecastState().loading"
        [error]="forecastState().error"
        (retry)="retry()"
      />
    </section>
  </main>
</div>
