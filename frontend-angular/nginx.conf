server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://api:8080; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
  # Sağlık uçları (dış izleme servisi için): /healthz ve /healthz/ready API'ye gider; yoksa SPA her zaman 200 dönerdi.
  location /healthz { proxy_pass http://api:8080; proxy_read_timeout 15s; }
  location / { try_files $uri /index.html; }
}