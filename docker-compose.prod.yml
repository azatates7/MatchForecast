# Canlı ortam: docker compose -f docker-compose.prod.yml up -d --build
#
# Sunucudaki .env dosyasında (repoya girmez) bulunması ZORUNLU olanlar:
#   CLOUDFLARE_TUNNEL_TOKEN=...
#   ConnectionStrings__Supabase=Host=...;Port=5432;...;SSL Mode=Require;Maximum Pool Size=10
#   AppSettings__EncryptionKey=<32 byte base64>   (geliştirmedekinden FARKLI olabilir; kaybedilirse şifreli ayarlar çözülemez)
#
# İlk çalıştırmada Production ayarları veritabanında henüz yoktur: o an .env'de/ortamda bulunan değerler (Jwt__SecretKey,
# Smtp__Password, Ai__Gemini__ApiKey, Auth__PasswordResetUrl...) app_settings tablosuna kopyalanır. Sonrasında bu
# değerler .env'den silinebilir; değişiklikler /api/app-settings ile yapılır (veritabanı değerleri ortamı ezer).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    # ports yok: Kafka yalnızca compose ağında (kafka:9092), dışarıya açılmaz.
    environment:
      # Volume'deki veri bu cluster'a aittir; sabit tutulur ki container yeniden oluşturulunca açılış hatası vermesin.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168        # 7 gün; tahminler zaten DB'de kalıcı, Kafka'daki kopya yeniden işleme içindir.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"  # Varsayılan 1 GB heap; küçük VPS için düşürüldü.
    volumes: ["kafka-data:/var/lib/kafka/data"]   # Container yeniden oluşturulunca mesajlar ve offset'ler kaybolmasın.

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Aşağıdakiler yalnızca ilk çalıştırmada veritabanına kopyalanır (Production satırları yoksa).
      Redis__ConnectionString: redis:6379
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:9092
      RateLimiting__TrustCloudflareHeader: "true" # API'ye yalnızca tunnel üzerinden ulaşılıyor; CF-Connecting-IP güvenilir.
      Ai__Provider: Gemini                         # Ollama canlıda yok (bkz. Ai__Ollama__* ile Ollama Cloud seçeneği).
    volumes: ["./logs:/app/logs"]
    depends_on: [redis, kafka]

  web:
    build: ./frontend            # Angular için: ./frontend-angular
    restart: unless-stopped
    depends_on: [api]
    # ports yok: dışarıya yalnızca Cloudflare Tunnel üzerinden açılır (sunucuda açık port gerekmez).

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on: [web]
    # Cloudflare panelinde public hostname: domain.com -> http://web:80

volumes:
  kafka-data: